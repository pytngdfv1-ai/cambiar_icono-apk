name: Cambiar Icono y Firmar APK

on:
  workflow_dispatch: # Permite ejecutar la acción manualmente con el botón Run workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Descargar uber-apk-signer
        run: |
          # Obtener la URL de descarga directa de la última release válida vía API de GitHub
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/PatrickF1/uber-apk-signer/releases/latest | grep "browser_download_url.*jar" | cut -d : -f 2,3 | tr -d \")
          curl -L -o uber-apk-signer.jar "$DOWNLOAD_URL"

      - name: Descompilar APK
        run: |
          java -jar APKEditor.jar d -i app-debug.apk -o apk_decompiled
          ls -la apk_decompiled

      - name: Reemplazar iconos
        run: |
          # Busca y reemplaza ic_launcher en cualquier subcarpeta dentro de apk_decompiled
          find apk_decompiled -name "ic_launcher*.png" -exec cp logo.png {} \;

      - name: Recompilar APK
        run: |
          java -jar APKEditor.jar b -i apk_decompiled -o app-modificada.apk

      - name: Firmar APK
        run: |
          java -jar uber-apk-signer.jar --apks app-modificada.apk --out output/

      - name: Subir el APK final como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Con-Nuevo-Icono
          path: output/*.apk
